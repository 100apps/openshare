plugins { id 'com.android.application' }
android {
    namespace 'us.gfzj.openshare.sample'
    compileSdk { version = release(37) { minorApiLevel = 2 } }
    defaultConfig {
        applicationId 'us.gfzj.openshare.sample'
        minSdk 23
        targetSdk 37
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError true; warningsAsErrors true }
}
dependencies { implementation project(':openshare'); implementation project(':openshare-wechat') }
