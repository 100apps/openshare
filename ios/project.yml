name: OpenShareCI
options:
  deploymentTarget:
    iOS: '13.0'
settings:
  base:
    CODE_SIGNING_ALLOWED: NO
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_VERSION: '5.0'
targets:
  OpenShareSample:
    type: application
    platform: iOS
    sources: [Sample]
    dependencies:
      - target: OpenShare
    info:
      path: Sample/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: OSShareSceneDelegate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: us.gfzj.OpenShareSample
  OpenShare:
    type: framework
    platform: iOS
    sources:
      - path: ../openshare
        headerVisibility: public
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: us.gfzj.OpenShare
        MODULEMAP_FILE: '$(SRCROOT)/OpenShare.modulemap'
        OTHER_LDFLAGS: ['$(inherited)', '-ObjC']
  OpenShareWeChat:
    type: framework
    platform: iOS
    sources:
      - path: ../adapters/ios
        headerVisibility: public
    dependencies:
      - target: OpenShare
      - framework: ../.build/WechatOpenSDK.xcframework
        embed: false
      - sdk: Security.framework
      - sdk: WebKit.framework
      - sdk: libz.tbd
      - sdk: libsqlite3.tbd
      - sdk: libc++.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: us.gfzj.OpenShareWeChat
        OTHER_LDFLAGS: ['$(inherited)', '-ObjC']
  OpenShareTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: OpenShareSample
      - target: OpenShare
      - target: OpenShareWeChat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: us.gfzj.OpenShareTests
        TEST_HOST: '$(BUILT_PRODUCTS_DIR)/OpenShareSample.app/OpenShareSample'
        BUNDLE_LOADER: '$(TEST_HOST)'
schemes:
  OpenShareCI:
    build:
      targets:
        OpenShare: all
        OpenShareWeChat: all
        OpenShareSample: all
    test:
      targets: [OpenShareTests]
