name: Mobile CI
on:
  push:
    branches: [master, 'codex/**']
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
      - name: Install stable Android SDK
        run: sdkmanager 'platforms;android-37.2' 'build-tools;37.0.0'
      - name: Test, lint and build libraries and sample
        working-directory: android
        run: ./gradlew test lint assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports-and-builds
          path: |
            android/**/build/reports/
            android/**/build/outputs/aar/
            android/sample/build/outputs/apk/debug/
  ios:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Record Xcode and available SDKs
        run: xcodebuild -version && xcodebuild -showsdks
      - name: Install project generator
        run: brew install xcodegen
      - name: Download pinned official WeChat SDK
        run: bash scripts/download-wechat-ios.sh
      - name: Generate test project
        run: xcodegen generate --spec ios/project.yml
      - name: Build Swift package without vendor SDKs
        run: xcodebuild -scheme OpenShare -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Test on iPhone and iPad
        run: bash scripts/ios-test.sh
      - name: Build legacy demo with current SDK
        run: xcodebuild -project OpenShareDemo/openshare.xcodeproj -scheme openshare -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Lint CocoaPods core and optional adapter
        run: |
          pod lib lint OpenShare.podspec --subspec=Core --allow-warnings
          pod lib lint OpenShare.podspec --subspec=WeChat --allow-warnings
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-results-${{ matrix.runner }}
          path: .build/*.xcresult
